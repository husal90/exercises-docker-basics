name: debug
on: push
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: probe
        run: |
          emit() { echo "::notice title=$1::$(echo "$2" | tail -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          emit nodetar "$(docker run --rm ubuntu:22.04 sh -c 'getent ahosts nodejs.org | head -3; apt-get -v >/dev/null; which curl || echo nocurl' 2>&1; time (timeout 40 docker run --rm curlimages/curl -sSI -m 30 https://nodejs.org/dist/v16.20.2/node-v16.20.2-linux-x64.tar.xz 2>&1 | head -3) 2>&1)"
          emit pw "$( (cd tests/playwright && npm install --no-audit --no-fund >/dev/null 2>&1; time timeout 120 npx --yes playwright install --with-deps chromium 2>&1 | tail -8; echo "rc=$?") 2>&1)"
