name: debug
on: push
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          r=""
          for h in archive.ubuntu.com mirrors.edge.kernel.org mirrors.kernel.org mirror.ubuntu.com us.archive.ubuntu.com ftp.fau.de mirror.aarnet.edu.au deb.debian.org mirrors.mit.edu mirror.math.princeton.edu ubuntu.mirror.constant.com mirrors.xtom.com mirror.rackspace.com mirror.us.leaseweb.net packages.microsoft.com azure.archive.ubuntu.com ports.ubuntu.com registry.npmjs.org github.com; do
            if getent hosts $h >/dev/null; then r="$r\nOK $h"; else r="$r\nNO $h"; fi
          done
          echo "::notice title=hostdns::$(printf "$r" | awk '{printf "%s%%0A", $0}')"
          r=""
          for h in archive.ubuntu.com mirrors.edge.kernel.org mirrors.kernel.org deb.debian.org mirror.us.leaseweb.net mirrors.xtom.com mirror.rackspace.com; do
            if docker run --rm ubuntu:24.04 getent hosts $h >/dev/null; then r="$r\nOK $h"; else r="$r\nNO $h"; fi
          done
          echo "::notice title=ctrdns::$(printf "$r" | awk '{printf "%s%%0A", $0}')"
